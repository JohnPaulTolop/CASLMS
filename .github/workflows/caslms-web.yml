name: CASLMS Web Build

on:
  push:
    branches:
      - feature/course-sections
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        shell: bash
        env:
          FIREBASE_APPCHECK_WEB_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_WEB_SITE_KEY }}
        run: |
          if [ -z "$FIREBASE_APPCHECK_WEB_SITE_KEY" ]; then
            echo "Missing Firebase App Check site key."
            exit 1
          fi

          flutter build web --release --no-pub \
            --dart-define="FIREBASE_APPCHECK_WEB_SITE_KEY=$FIREBASE_APPCHECK_WEB_SITE_KEY"

          test -f build/web/index.html

      - name: Build completed
        run: echo "CASLMS web compiled successfully. No deployment performed."
      - name: Deploy CASLMS to Vercel (production only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CASLMS_PRODUCTION_DEPLOY_ENABLED == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -f build/web/index.html

          npm install --global vercel@latest

          vercel pull --yes --environment=production \
            --token="$VERCEL_TOKEN"

          mkdir -p .vercel/output/static

          cp -a build/web/. .vercel/output/static/

          printf '%s\n' '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json

          vercel deploy --prebuilt --prod --yes \
            --token="$VERCEL_TOKEN"
